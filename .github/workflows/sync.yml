name: drom-sync

on:
  # Расписанием управляет systemd-таймер на VPS-A через GitHub API (workflow_dispatch).
  # Родной cron не используется — он ненадёжен и создавал бы второй источник запусков.
  workflow_dispatch: {}        # запуск извне (планировщик VPS-A) и вручную из вкладки Actions

# Не запускать два прогона одновременно (курсор круга в app_settings — общий).
concurrency:
  group: drom-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build

      # Техдомен базы не резолвится на раннерах GitHub, но по IP сервер доступен (проверено).
      # Пиним имя хоста на IP из переменной DB_HOST_IP перед запуском синка. Имя в URL остаётся
      # доменным → TLS-сертификат валиден (в отличие от обращения по голому IP).
      - name: pin DB host in /etc/hosts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DB_HOST_IP: ${{ vars.DB_HOST_IP }}
        run: |
          set -euo pipefail
          if [ -z "${DB_HOST_IP:-}" ]; then
            echo "::error::Переменная DB_HOST_IP не задана (Settings → Variables). Без неё имя хоста базы не резолвится на раннере — синк не сможет подключиться." >&2
            exit 1
          fi
          HOST=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^[a-z]+://##; s#/.*##')
          echo "$DB_HOST_IP  $HOST" | sudo tee -a /etc/hosts
          getent hosts "$HOST"   # подтверждение, что имя теперь резолвится

      - name: run sync
        run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DROM_CATALOG_URL: ${{ secrets.DROM_CATALOG_URL }}
          DROM_RUN_SOURCE: actions
